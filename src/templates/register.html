{% extends "base.html" %}
{% block content %}
<h2>Create account</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>First name
    <input name="first_name" value="{{ form.get('first_name', '') }}"
           {% if errors.get('first_name') %}aria-invalid="true"{% endif %}>
    {% if errors.get('first_name') %}<small>{{ errors['first_name'] }}</small>{% endif %}
  </label>
  <label>Last name
    <input name="last_name" value="{{ form.get('last_name', '') }}"
           {% if errors.get('last_name') %}aria-invalid="true"{% endif %}>
    {% if errors.get('last_name') %}<small>{{ errors['last_name'] }}</small>{% endif %}
  </label>
  <label>Email
    <input name="email" type="email" value="{{ form.get('email', '') }}"
           {% if errors.get('email') %}aria-invalid="true"{% endif %}>
    {% if errors.get('email') %}<small>{{ errors['email'] }}</small>{% endif %}
  </label>
  <label>Phone (optional)
    <input name="phone_number" value="{{ form.get('phone_number', '') }}"
           {% if errors.get('phone_number') %}aria-invalid="true"{% endif %}>
    {% if errors.get('phone_number') %}<small>{{ errors['phone_number'] }}</small>{% endif %}
  </label>
  <label>Password
    <input name="password" type="password"
           {% if errors.get('password') %}aria-invalid="true"{% endif %}>
    {% if errors.get('password') %}<small>{{ errors['password'] }}</small>{% endif %}
  </label>
  <button type="submit">Create account</button>
</form>
<p>Already have an account? <a href="{{ url_for('login') }}">Log in</a>.</p>
{% endblock %}
