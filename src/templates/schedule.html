{% extends "base.html" %}
{% block content %}
<h2>My schedule</h2>
{% if courses %}
  <table>
    <thead>
      <tr><th>Course</th><th>Number</th><th>Instructor</th><th></th></tr>
    </thead>
    <tbody>
      {% for c in courses %}
      <tr>
        <td>{{ c.course_name }}</td>
        <td>{{ c.course_number }}</td>
        <td>{{ c.instructor }}</td>
        <td>
          <form method="post" action="{{ url_for('drop', course_id=c.course_id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="secondary">Drop</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <p>You're not enrolled in any classes yet. <a href="{{ url_for('courses') }}">Find classes</a>.</p>
{% endif %}
{% endblock %}
