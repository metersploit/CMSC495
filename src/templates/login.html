{% extends "base.html" %}
{% block content %}
<h2>Log in</h2>
<form method="post">
  <label>Email
    <input name="email" type="email" value="{{ form.get('email', '') }}"
           {% if errors.get('email') %}aria-invalid="true"{% endif %}>
    {% if errors.get('email') %}<small>{{ errors['email'] }}</small>{% endif %}
  </label>
  <label>Password
    <input name="password" type="password"
           {% if errors.get('password') %}aria-invalid="true"{% endif %}>
    {% if errors.get('password') %}<small>{{ errors['password'] }}</small>{% endif %}
  </label>
  <button type="submit">Log in</button>
</form>
<p>Need an account? <a href="{{ url_for('register') }}">Create one</a>.</p>
{% endblock %}
