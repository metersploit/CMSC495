{% extends "base.html" %}
{% block content %}
<h2>Log in</h2>
<form method="post" style="max-width: 400px;">
  <label>Email
    <input name="email" type="email" value="{{ form.get('email', '') }}"
           placeholder="you@example.com"
           {% if errors.get('email') %}aria-invalid="true"{% endif %}>
    {% if errors.get('email') %}<small>{{ errors['email'] }}</small>{% endif %}
  </label>
  <label>Password
    <input name="password" type="password"
           placeholder="••••••••"
           {% if errors.get('password') %}aria-invalid="true"{% endif %}>
    {% if errors.get('password') %}<small>{{ errors['password'] }}</small>{% endif %}
  </label>
  <button type="submit" style="width: 100%; margin-top: 0.5rem;">Log in</button>
</form>
<p style="margin-top: 1rem; font-size: 0.9rem; color: #64748b;">
  Need an account? <a href="{{ url_for('register') }}">Create one</a>.
</p>
{% endblock %}
